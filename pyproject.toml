[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "besgen"
version = "0.2.0"
description = "Generate convention-oriented software project repositories."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["besa", "click>=8.1", "PyYAML>=6.0"]

[project.scripts]
besgen = "besgen.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
docs = ["cpdocs", "properdocs", "mkdocs-materialx"]

[tool.hatch.build.targets.wheel]
packages = ["src/besgen"]

[tool.hatch.build.targets.wheel.force-include]
"share/besgen" = "share/besgen"

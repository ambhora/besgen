name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync --group dev
      - run: uv run pytest
      - name: Exercise generated repositories
        run: uv run python tools/generate_examples.py --output build/examples --clean --verify

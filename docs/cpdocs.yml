contract: 3

build:
  feature-sets: >-
    {{python}} -m cpdocs manifest python feature-sets
    --source {{source}}
    --output {{output-file}}
  build: >-
    {{python}} -m cpdocs manifest python build
    --source {{source}}
    --feature-set {{feature-set}}
    --output {{output-file}}
    --package besgen
    --package-source src/besgen

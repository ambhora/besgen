[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-example-dev"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "PyYAML>=6.0"]

[project.scripts]
python-example-dev = "python_example_dev.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
docs = ["cpdocs", "properdocs"]

[tool.hatch.build.targets.wheel]
packages = ["src/python_example_dev"]
